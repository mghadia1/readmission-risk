[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "readmission-risk"
version = "0.1.0"
description = "30-day readmission risk for diabetic inpatients: patient-grouped splits, calibration, capacity thresholds, and a subgroup audit"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.1",
  "pandas>=2.2",
  "numpy>=2.0",
  "scikit-learn>=1.5",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
readmission = "readmission.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
readmission = ["sql/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
